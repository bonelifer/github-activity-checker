name: Bug report
description: Report a problem with github-activity-checker
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command used
      description: The exact command line (redact org names/tokens if needed).
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Output / error / traceback
      render: shell
    validations:
      required: false

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "e.g. 3.11.4"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Ubuntu 22.04"
    validations:
      required: true
